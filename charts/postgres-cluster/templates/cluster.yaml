apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ required "name is required" .Values.name }}
spec:
  # 1 primary + (instances - 1) standbys. CNPG wires standbys up with
  # streaming replication automatically — nothing here configures
  # primary_conninfo, replication slots, or pg_basebackup by hand.
  instances: {{ required "instances is required" .Values.instances }}

  imageName: {{ required "imageName is required" .Values.imageName | quote }}

  storage:
    size: {{ required "storage.size is required" .Values.storage.size | quote }}
    storageClass: {{ required "storage.storageClass is required" .Values.storage.storageClass | quote }}

  bootstrap:
    initdb:
      database: {{ required "bootstrap.initdb.database is required" .Values.bootstrap.initdb.database | quote }}
      owner: {{ required "bootstrap.initdb.owner is required" .Values.bootstrap.initdb.owner | quote }}
      {{- with .Values.bootstrap.initdb.secretName }}
      secret:
        name: {{ . | quote }}
      {{- end }}

# Open WebUI in front of the ollama Application's release; shares its
# namespace (created, with its Pod Security labels, by that Application).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd-apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-apps
  sources:
    - repoURL: https://helm.openwebui.com/
      chart: open-webui
      targetRevision: 16.0.0
      helm:
        releaseName: open-webui
        valueFiles:
          - $values/values/open-webui/values.yaml
    - repoURL: https://github.com/ykantoni/k8s-apps.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
